services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: traceback
      POSTGRES_USER: traceback
      POSTGRES_PASSWORD: traceback
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceback -d traceback"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=traceback;Username=traceback;Password=traceback
      MigrateOnStartup: "true"
      IngestFixturesOnStartup: "true"
      # Read-only GitHub connector. Values come from .env (git-ignored); see
      # .env.example and docs/integrations/github.md. Leave GITHUB_TOKEN empty
      # to run without the connector - synchronization then fails fast with a
      # configuration error instead of starting up broken.
      GitHub__Token: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GitHub__InitialLookbackDays: ${GITHUB_INITIAL_LOOKBACK_DAYS:-30}
      # Set OTEL_EXPORTER_OTLP_ENDPOINT to enable OTLP export, e.g. to an
      # otel-collector + Grafana stack. Off by default.
    ports:
      # Loopback only: the API has no authentication yet, so it must not be
      # reachable from the network. See the security section of the README.
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
