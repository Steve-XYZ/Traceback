services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: traceback
      POSTGRES_USER: traceback
      POSTGRES_PASSWORD: traceback
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceback -d traceback"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=traceback;Username=traceback;Password=traceback
      MigrateOnStartup: "true"
      IngestFixturesOnStartup: "true"
      # Set OTEL_EXPORTER_OTLP_ENDPOINT to enable OTLP export, e.g. to an
      # otel-collector + Grafana stack. Off by default.
    ports:
      - "8080:8080"

volumes:
  postgres-data:
